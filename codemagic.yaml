workflows:
  ios-workflow:
    name: Ludi iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Ludi-Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.ludi.teach
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ludi.teach
    scripts:
      - name: Flutter dependencies
        script: |
          flutter pub get
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          set -e
          flutter build ipa --release
      - name: List build artifacts
        script: |
          echo "=== build/ios directory structure ==="
          find build/ios -type f 2>/dev/null || echo "build/ios not found"
          echo ""
          echo "=== all .ipa files in workspace ==="
          find . -name "*.ipa" 2>/dev/null || echo "no .ipa found anywhere"
          echo ""
          echo "=== build/ios/ipa contents ==="
          ls -la build/ios/ipa/ 2>/dev/null || echo "build/ios/ipa/ does not exist"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
