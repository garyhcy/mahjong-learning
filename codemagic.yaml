workflows:
  ios-workflow:
    name: Ludi iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Ludi App Store
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.ludi.teach
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ludi.teach
    scripts:
      - name: Flutter dependencies
        script: |
          flutter pub get
      - name: Build IPA
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        submit_to_testflight: true
